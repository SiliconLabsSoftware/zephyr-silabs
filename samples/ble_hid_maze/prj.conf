CONFIG_DISPLAY=y
CONFIG_GPIO=y
CONFIG_INPUT=y

CONFIG_LOG=y
CONFIG_BT_LOG_LEVEL_INF=y
CONFIG_SPEED_OPTIMIZATIONS=y

CONFIG_HEAP_MEM_POOL_SIZE=65536

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y

CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# Needed for some BLE HID mouses:
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_BT_SMP_SC_ONLY=n
CONFIG_BT_SMP_SC_PAIR_ONLY=n

CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Some targets, such as the xg24 boards, include onboard SPI flash,
# which this application does not use.
CONFIG_SPI_NOR=n

CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
