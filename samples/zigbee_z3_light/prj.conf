CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_ZIGBEE_SILABS=y
# Z3 Light uses the coordinator/router stack.
CONFIG_ZIGBEE_SILABS_STACK_COORDINATOR=y
CONFIG_ZIGBEE_SILABS_R23_SUPPORT=y
CONFIG_ZIGBEE_SILABS_CBKE=y
CONFIG_ZIGBEE_SILABS_DEBUG_BASIC=y
CONFIG_ZIGBEE_SILABS_SOURCE_ROUTE=y
CONFIG_ZIGBEE_SILABS_GP=y
CONFIG_ZIGBEE_SILABS_ZLL=y

CONFIG_LOG=y
CONFIG_PRINTK=y

CONFIG_ENTROPY_GENERATOR=y
CONFIG_SILABS_ZIGBEE_RUNTIME=y
CONFIG_SILABS_ZIGBEE_RUNTIME_THREAD=y
# Match 16 KiB zb_token_partition (2 x 8 KiB pages).
CONFIG_SILABS_ZIGBEE_TOKEN_NVS_SECTOR_COUNT=2

# Enable Zephyr PTI driver (silabs,pti DT node in boards/*.overlay).
CONFIG_DEBUG_DRIVER=y

# OSS debug-print plugin requires printf.h shim; keep prebuilt debug-basic blob only.
# CONFIG_SILABS_SISDK_ZIGBEE_DEBUG_PRINT is not set

# Platform sl_cli is not ported to Zephyr yet; drop Zigbee CLI plugin sources.
# CONFIG_SILABS_SISDK_ZIGBEE_CLI is not set
# CONFIG_SILABS_SISDK_ZIGBEE_CORE_CLI is not set
# CONFIG_SILABS_SISDK_ZIGBEE_ZCL_CLI is not set
# CONFIG_SILABS_SISDK_ZIGBEE_GREEN_POWER_CLIENT_CLI is not set
