CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_GPIO=y

CONFIG_ZIGBEE_SILABS=y
# Z3 Light uses the coordinator/router stack.
CONFIG_ZIGBEE_SILABS_STACK_COORDINATOR=y
CONFIG_ZIGBEE_SILABS_R23_SUPPORT=y
CONFIG_ZIGBEE_SILABS_CBKE=y
CONFIG_ZIGBEE_SILABS_DEBUG_BASIC=y
CONFIG_ZIGBEE_SILABS_SOURCE_ROUTE=y
CONFIG_ZIGBEE_SILABS_GP=y
CONFIG_ZIGBEE_SILABS_ZLL=y

CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_REBOOT=y

CONFIG_ENTROPY_GENERATOR=y
CONFIG_SILABS_ZIGBEE_RUNTIME=y
CONFIG_SILABS_ZIGBEE_RUNTIME_THREAD=y
# Match 16 KiB zb_token_partition (2 x 8 KiB pages).
CONFIG_SILABS_ZIGBEE_TOKEN_NVS_SECTOR_COUNT=2

# Zephyr PM owns sleep entry (pm_state_set → SiSDK sl_power_manager_sleep).
# Pulls SILABS_SISDK_POWER_MANAGER / HFXO_MANAGER defaults on S2.
CONFIG_PM=y

# Enable Zephyr PTI driver (silabs,pti DT node in boards/*.overlay).
CONFIG_DEBUG_DRIVER=y
CONFIG_SILABS_SISDK_ZIGBEE_DEBUG_PRINT=y

# Zephyr Shell front-end + SiSDK command dispatch (framework + plugin CLIs).
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SILABS_SISDK_CLI=y
CONFIG_SILABS_SISDK_ZIGBEE_CLI=y
CONFIG_SILABS_SISDK_ZIGBEE_CORE_CLI=y
CONFIG_SILABS_SISDK_ZIGBEE_ZCL_CLI=y
